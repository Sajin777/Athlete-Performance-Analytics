<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Analytics</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">

  <div class="login-box">

    <div class="logo-mark">AA</div>

    <h1>Athlete Analytics</h1>
    <p>Monitor. Analyze. Improve.</p>

    <form id="loginForm">

      <input
        id="username"
        type="text"
        placeholder="Email / Username"
        required
      >

      <div class="password">
        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >

        <button type="button" id="showPass">◉</button>
      </div>

      <div class="login-options">

        <label>
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot password?</a>

      </div>

      <button class="primary full">
        Sign In
      </button>

    </form>

    <small>
      Demo login: any username/password.
      Role can be changed after login.
    </small>

  </div>

</div>


<!-- APPLICATION -->
<div id="app" class="hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar">

    <div class="brand">

      <div class="logo-mark">
        AA
      </div>

      <div>
        <b>ATHLETE</b>
        <small>ANALYTICS</small>
      </div>

    </div>

    <nav id="nav"></nav>

    <div class="account">

      <div class="avatar">
        SJ
      </div>

      <div>
        <b>Sajin</b>
        <small id="accountRole">Coach</small>
      </div>

      <button id="logout">
        ↪
      </button>

    </div>

  </aside>


  <!-- MAIN -->
  <main>

    <header>

      <button id="menu" class="hamburger">
        ☰
      </button>

      <div class="search">
        ⌕
        <input
          id="search"
          placeholder="Search athletes, sessions..."
        >
      </div>

      <div class="header-actions">

        <select id="role">
          <option>Coach</option>
          <option>Athlete</option>
          <option>Admin</option>
        </select>

        <button>◔</button>

        <div class="avatar">
          SJ
        </div>

      </div>

    </header>


    <section id="page"></section>

  </main>

</div>


<!-- MODAL -->
<div id="modal" class="modal hidden">

  <div class="modal-box">

    <button id="closeModal" class="close">
      ×
    </button>

    <div id="modalBody"></div>

  </div>

</div>


<div id="toast"></div>


<script src="script.js"></script>

</body>
</html>
