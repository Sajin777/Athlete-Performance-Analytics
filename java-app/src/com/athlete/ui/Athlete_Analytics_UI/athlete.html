<head>

        :root {
            box-sizing: border-box;
            --bg: #eaf0ee;
            --card: #ffffff;
            --ink: #12263a;
            --mut: #5b6b7a;
            --line: #cfd9d6;
            --acc: #1b6a8f;
            --accT: #ffffff;
            --ok: #1f7a4d;
            --warn: #b4690e;
            --bad: #b3261e;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1a22;
                --card: #17252f;
                --ink: #e6eef2;
                --mut: #93a5b2;
                --line: #2a3d4a;
                --acc: #4fb0d8;
                --accT: #08202c;
                --ok: #4cc38a;
                --warn: #e8a24a;
                --bad: #f07a72;

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 20px;
            background: var(--ink);
            color: var(--bg);
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.2px;
        }

        header .who {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        main {

            margin: 0 auto;
            padding: 18px 16px 40px;

        .lanes {

        }

        nav {

            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        button,

            color: inherit;
        }

        nav button {
            padding: 8px 14px;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 6px;
            cursor: pointer;
        }

        nav button.on {
            background: var(--acc);
            color: var(--accT);
            border-color: var(--acc);
        }

        .btn {
            padding: 9px 16px;
            border: 0;
            border-radius: 6px;
            background: var(--acc);
            color: var(--accT);
            cursor: pointer;
            font-weight: 600;
        }

        .btn.alt {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--warn);
            outline-offset: 2px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 16px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 19px;
        }

        .tw {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 560px;
        }

        th,
        td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        th {
            color: var(--mut);
            font-weight: 600;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mut);
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 3px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .row > div {
            min-width: 180px;
            flex: 1;
        }

        .stat {
            border-left: 4px solid var(--acc);
            padding: 4px 12px;
        }

        .stat b {
            display: block;
            font-size: 24px;
        }

        .stat span {
            color: var(--mut);
            font-size: 13px;
        }

        .pill {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 13px;
            color: #ffffff;
        }

        .NORMAL {
            background: var(--ok);
        }

        .HIGH {
            background: var(--bad);
        }

        .LOW {
            background: var(--warn);
        }

        .NA {
            background: var(--mut);
        }

        .msg {
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 10px;
            background: var(--bg);
            border: 1px solid var(--line);
        }

        .err {
            color: var(--bad);
        }

        .note {
            color: var(--mut);
            font-size: 13px;
            margin-top: 12px;
        }

        .bar {
            height: 14px;
            background: var(--line);
            border-radius: 7px;
            position: relative;
            margin: 10px 0;
        }

        .bar i {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: var(--acc);
            border-radius: 7px;
        }

        .login {
            max-width: 380px;
            margin: 40px auto;
        }

        .demo {
            font-size: 13px;
            color: var(--mut);
            margin: 0 0 14px;
            padding-left: 18px;
        }

.eye-button {

.eye-button.active {
    color: white;
    background: var(--acc);
}

.eye-button:hover {
    color: white;
    background: var(--acc);
}
    </style>
</head>

        function visibleAthletes() {
    // Admin can see every athlete.
    if (user.role === "ADMIN") {
        return athletes;
    }

    if (user.role === "COACH") {
        return athletes.filter(

    );
}

        function sumWindow(id, date, lo, hi) {
            let total = 0;

            for (const s of sessions) {
                if (s.athleteId === id) {
                    const d = daysBetween(s.date, date);

                    if (d >= lo && d <= hi) {
                        total += workload(s);
                    }
                }
            }

            return total;
        }

        const acute = (id, date) => {
            return sumWindow(id, date, 0, 6);
        };

        const chronic = (id, date) => {
            return sumWindow(id, date, 7, 34);
        };

        function acwr(id, date) {
            const avg = chronic(id, date) / 4;

            return avg === 0 ? 0 : acute(id, date) / avg;
        }

        function status(v) {
            if (v === 0) {
                return ["INSUFFICIENT DATA", "NA"];
            }

            if (v > 1.5) {
                return ["HIGH WORKLOAD", "HIGH"];
            }

            if (v >= 0.8) {
                return ["NORMAL", "NORMAL"];
            }

            return ["LOW WORKLOAD", "LOW"];
        }

        function categoryComparison(id) {
            const athlete = findAthlete(id);

            if (!athlete) {
                return null;
            }

            const totals = visibleAthletes()
    .filter(
        a =>
            a.category.toLowerCase() ===
            athlete.category.toLowerCase()
    )
                .map(a => ({
                    id: a.id,
                    total: sessions
                        .filter(s => s.athleteId === a.id)
                        .reduce(
                            (total, s) => total + workload(s),
                            0
                        )
                }));

            const mine = totals.find(x => x.id === id).total;

            const avg = totals.reduce(
                (total, item) => total + item.total,
                0
            ) / totals.length;

            const pct =
                totals.filter(x => x.total <= mine).length /
                totals.length * 100;

            return {
                athlete,
                mine,
                avg,
                pct,
                n: totals.length
            };
        }

        function personalBests(id) {
            const list = sessions.filter(
                s => s.athleteId === id
            );

            if (!list.length) {
                return null;
            }

            return {
                sprint: Math.min(
                    ...list.map(s => s.sprint)
                ),
                distance: Math.max(
                    ...list.map(s => s.distance)
                ),
                weight: Math.max(
                    ...list.map(s => s.weight)
                ),
                hr: Math.min(
                    ...list.map(s => s.hr)
                )
            };
        }

function deleteCoach(id) {

    // Only Admin can delete coaches.
    if (!user || user.role !== "ADMIN") {
        alert("Only admin can delete coaches.");
        return;
    }

    // Find the coach.
    const coach = users.find(
        u => u.id === id && u.role === "COACH"
    );

    if (!coach) {
        alert("Coach not found.");
        return;
    }

    // Count athletes assigned to this coach.
    const assignedCount = athletes.filter(
        a => a.coachId === id
    ).length;

    const confirmed = confirm(
        `Are you sure you want to delete coach ${coach.username}?\n\n` +
        `${assignedCount} athlete(s) will become unassigned.`
    );

    if (!confirmed) {
        return;
    }

    // Delete the coach account.
    users = users.filter(
        u => !(u.id === id && u.role === "COACH")
    );

    // Unassign the athletes previously assigned to this coach.
    athletes = athletes.map(a => {
        if (a.coachId === id) {
            return {
                ...a,
                coachId: null
            };
        }

        return a;
    });

    alert("Coach deleted successfully.");

    render();
}


function submitCoach(e) {
    e.preventDefault();

    // Only the admin can create coach accounts
    if (!user || user.role !== "ADMIN") {
        return;
    }

    const username = $("#cu").value.trim();
    const password = $("#cp").value;
    const confirmPassword = $("#cp2").value;
    const message = $("#cm");

    // Check whether the username already exists
    const exists = users.some(
        u => u.username.toLowerCase() === username.toLowerCase()
    );

    if (exists) {
        message.className = "err";
        message.textContent =
            "This username already exists. Choose another username.";
        return;
    }

    // Validate the password
    if (password.length < 8) {
        message.className = "err";
        message.textContent =
            "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.className = "err";
        message.textContent =
            "Passwords do not match.";
        return;
    }

    // Generate a unique account ID
    const id = users.length
        ? Math.max(...users.map(u => u.id)) + 1
        : 1;

    // Create the new coach account
    const newCoach = {
        id: id,
        username: username,
        password: password,
        role: "COACH"
    };

    // Add and save the account
    users.push(newCoach);

    try {
        localStorage.setItem(
            "apaUsers",
            JSON.stringify(users)
        );
    } catch (error) {
        // Undo the in-memory addition if saving fails
        users.pop();

        message.className = "err";
        message.textContent =
            "Unable to save the account in this browser.";
        return;
    }

    // Refresh the page content to show the new coach
    render();

    // Display a success message on the refreshed form
    $("#cm").textContent =
        "Coach account created successfully!";
}

        function login(e) {
    e.preventDefault();

    const username = $("#u").value.trim();
    const password = $("#p").value;

    // Step 1: Check administrator and coach accounts
    const foundUser = users.find(
        u =>
            u.username === username &&
            u.password === password
    );

    if (foundUser) {
        user = foundUser;
        tab = null;
        render();
        return;
    }

    // Step 2: Check athlete accounts
    const foundAthlete = athlete.find(
        a =>
            a.username === username &&
            a.password === password
    );

    if (foundAthlete) {
        // Create the athlete's login session
        user = {
            id: foundAthlete.id,
            username: foundAthlete.username,
            role: "ATHLETE",
            athleteId: foundAthlete.athleteId
        };

        tab = null;
        athleteSel = foundAthlete.athleteId;

        render();
        return;
    }

    // Step 3: Display an error if the credentials are incorrect
    $("#le").textContent = "Invalid username or password.";
}

        function stat(value, label) {
            return `
                <div class="stat">
                    <b>${value}</b>

        function perfView() {
            const athlete = findAthlete(athleteSel);

            if (!athlete) {
                return `
                    <div class="card">
                        Athlete not found.
                    </div>
                `;
            }

            const list = sessions
                .filter(s => s.athleteId === athlete.id)
                .sort((x, y) => y.date.localeCompare(x.date));

            return `
                <div class="card">
                    <h2>${esc(athlete.name)}</h2>

                    <p class="note" style="margin: 0 0 12px">
                        ${esc(athlete.event)} ·
                        ${esc(athlete.category)}
                    </p>

                    ${
                        list.length
                            ? table(
                                [
                                    "Date",
                                    "Session",
                                    "Duration (min)",
                                    "RPE",
                                    "Workload (AU)",
                                    "Sprint (s)",
                                    "Distance (km)",
                                    "Weight (kg)",
                                    "Heart rate (bpm)"
                                ],

                                list.map(s => [
                                    s.date,
                                    esc(s.type),
                                    s.duration,
                                    s.rpe,
                                    f2(workload(s)),
                                    f2(s.sprint),
                                    f2(s.distance),
                                    f2(s.weight),
                                    f2(s.hr)

        function acwrView() {
            const athlete = findAthlete(athleteSel);

            if (!athlete) {
                return `
                    <div class="card">
                        Athlete not found.
                    </div>
                `;
            }

            const date = iso(today());
            const ac = acute(athlete.id, date);
            const ch = chronic(athlete.id, date);
            const value = acwr(athlete.id, date);
            const [statusText, statusClass] = status(value);

            return `
                <div class="card">
                    <h2>
                        ACWR analysis — ${esc(athlete.name)}
                    </h2>

                    <div class="grid">
                        ${stat(f2(ac) + " AU", "7-day acute workload")}
                        ${stat(f2(ch) + " AU", "28-day workload")}
                        ${stat(f2(ch / 4) + " AU", "28-day average weekly")}
                        ${stat(value === 0 ? "—" : f2(value), "ACWR")}
                    </div>

                    <p>
                        <span class="pill ${statusClass}">
                            ${statusText}
                        </span>
                    </p>

                    <p class="note">
                        ACWR = acute workload ÷ average weekly workload
                        of the previous 28 days. Healthy range here:
                        0.8–1.5. It is a workload monitoring indicator,
                        not a diagnosis.
                    </p>
                </div>
            `;
        }

function deleteAthlete(id) {

    if (
        !user ||
        (user.role !== "ADMIN" && user.role !== "COACH")
    ) {
        alert("You are not authorized to delete athletes.");
        return;
    }

    const athleteProfile = athletes.find(a => a.id === id);

    if (!athleteProfile) {
        alert("Athlete not found.");
        return;
    }

    // Coach can delete only their assigned athletes.
    if (
        user.role === "COACH" &&
        athleteProfile.coachId !== user.id
    ) {
        alert("You can delete only your assigned athletes.");
        return;
    }

    const confirmed = confirm(
        `Are you sure you want to delete ${athleteProfile.name}?`
    );

    if (!confirmed) return;

    athletes = athletes.filter(a => a.id !== id);

    athlete = athlete.filter(a => a.athleteId !== id);

    sessions = sessions.filter(s => s.athleteId !== id);

    if (athleteSel === id) {
        athleteSel = athletes[0]?.id ?? null;
    }

    alert("Athlete deleted successfully.");

    render();
}

        function submitAthlete(e) {
    e.preventDefault();

    const id = +$("#aid").value;
    const name = $("#an").value.trim();
    const age = +$("#aa").value;
    const event = $("#ap").value.trim();
    const category = $("#as").value.trim();
    const username = $("#au").value.trim();
    const password = $("#apw").value;
    
const coachId = user.role === "ADMIN"
    ? Number($("#ac").value)
    : user.role === "COACH"
        ? user.id
        : null;

const message = $("#am");

if (coachId === null) {
    alert("You are not authorized to add athletes.");
    return;
}

// Verify that the selected coach exists.
const assignedCoach = users.find(
    u => u.id === coachId && u.role === "COACH"
);

if (!assignedCoach) {
    message.className = "err";
    message.textContent = "Please select a valid coach.";
    return;
}


    // Check whether the athlete ID already exists
    if (findAthlete(id)) {
        message.className = "err";
        message.textContent =
            "This athlete ID already exists.";

        return;
    }

    // Check whether the username already exists
    const usernameExists =
        users.some(u => u.username === username) ||
        athletes.some(a => a.username === username);

    if (usernameExists) {
        message.className = "err";
        message.textContent =
            "This username is already taken. Choose another.";

        return;
    }

    // Check that the required text fields are not empty
    if (
        !name ||
        !event ||
        !category ||
        !username ||
        !password
    ) {
        message.className = "err";
        message.textContent =
            "Please fill in all the fields.";

        return;
    }

    // Check the password length
    if (password.length < 6) {
        message.className = "err";
        message.textContent =
            "Password must contain at least 6 characters.";

        return;
    }

    // Create the new athlete account
    const newAthlete = {
    id: id,
    name: name,
    age: age,
    event: event,
    category: category,
    coachId: coachId
};

    // Save the athlete
    athletes.push(newAthlete);

    const accountId = athlete.length
    ? Math.max(...athlete.map(a => a.id)) + 1
    : 1;

athlete.push({
    id: accountId,
    username: username,
    password: password,
    role: "ATHLETE",
    athleteId: id
});

    // Show success message
    message.className = "";
    message.textContent =
        "Athlete added successfully! Login account created.";

    // Clear the form
    e.target.reset();
}

        function submitSession(e) {
            e.preventDefault();

            const selectedAthleteId = Number($("#sa").value);

const allowed = visibleAthletes().some(
    a => a.id === selectedAthleteId
);

if (!allowed) {
    alert("You cannot add a session for this athlete.");
    return;
}

            const message = $("#sm");
            const rpe = +$("#sr").value;

            if (rpe < 0 || rpe > 10) {
                message.className = "err";
                message.textContent =
                    "RPE must be between 0 and 10.";
                return;
            }

            const session = {
                id: nextId++,
                athleteId: selectedAthleteId,
                date: $("#sd").value,
                type: $("#st").value.trim(),
                duration: +$("#sdu").value,
                rpe,
                sprint: +$("#ss").value,
                distance: +$("#sdi").value,
                weight: +$("#sw").value,
                hr: +$("#sh").value
            };

            sessions.push(session);

            message.className = "";

            message.textContent =
                "Training session added. Calculated workload = " +
                f2(workload(session)) +
                " AU.";
        }

        render();
